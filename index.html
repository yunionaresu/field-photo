<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>現場写真.exe</title>

  <style>
    /* =========================================================
       Windows 95 共通クラシックスタイル
    ========================================================= */
    :root {
      --win-bg: #c0c0c0;
      --win-light: #ffffff;
      --win-shadow: #808080;
      --win-dark: #000000;
      --win-title: #000080;
      --win-title-text: #ffffff;
      --win-font: "MS UI Gothic", "MS PGothic", "Segoe UI", Tahoma, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--win-bg);
      color: #000000;
      font-family: var(--win-font);
      overflow: hidden;
      overscroll-behavior: none;
      font-size: 13px;
    }

    /* 3D立体凸枠（Raised Bevel） */
    .win-outset {
      border: 2px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      box-shadow: inset 1px 1px 0 var(--win-bg), inset -1px -1px 0 var(--win-shadow);
    }

    /* 3D立体凹枠（Sunken Bevel / 押し込み） */
    .win-inset {
      border: 2px solid;
      border-color: var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
      box-shadow: inset 1px 1px 0 var(--win-dark), inset -1px -1px 0 var(--win-bg);
    }

    /* 標準Win95ボタン */
    .win-btn {
      background: var(--win-bg);
      border: 2px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      box-shadow: inset 1px 1px 0 var(--win-bg), inset -1px -1px 0 var(--win-shadow);
      color: #000;
      font-family: var(--win-font);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 4px 8px;
      text-decoration: none;
    }
    .win-btn:active, .win-btn.active, .win-btn.selected {
      border-color: var(--win-dark) var(--win-light) var(--win-light) var(--win-dark);
      box-shadow: inset 1px 1px 0 var(--win-shadow), inset -1px -1px 0 var(--win-bg);
      background: #b5b5b5;
      padding: 5px 7px 3px 9px; /* 押した時のわずかなズレを再現 */
    }

    /* タイトルバー */
    .title-bar {
      height: 28px;
      background: var(--win-title);
      color: var(--win-title-text);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .title-bar-text {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
    }
    .title-bar-controls {
      display: flex;
      gap: 2px;
    }
    .title-btn {
      width: 18px;
      height: 16px;
      background: var(--win-bg);
      border: 1.5px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      color: #000;
      font-size: 10px;
      line-height: 1;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* メインウィンドウ */
    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: var(--win-bg);
      border: 3px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
    }

    /* メニューバー */
    .menu-bar {
      height: 24px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 8px;
      border-bottom: 1px solid var(--win-shadow);
      background: var(--win-bg);
    }
    .menu-item {
      cursor: pointer;
      color: #000;
    }
    .menu-item span {
      text-decoration: underline;
    }

    /* カメラファインダー枠 */
    #cameraStage {
      position: relative;
      flex: 1;
      min-height: 0;
      margin: 4px;
      background: #000;
      overflow: hidden;
      touch-action: none;
    }
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* カメラ起動ダイアログ */
    #cameraStart, #cameraError {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.7);
    }
    .dialog-box {
      width: 90%;
      max-width: 320px;
      background: var(--win-bg);
      border: 2px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      box-shadow: 2px 2px 0 var(--win-dark);
      padding: 2px;
    }
    .dialog-content {
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 10px;
    }

    /* スタンプ */
    #stampPreview {
      position: absolute;
      z-index: 8;
      display: none;
      padding: 4px 8px;
      border: 2px solid #fff;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      pointer-events: none;
      white-space: nowrap;
    }

    /* 矢印 */
    #arrowPreview {
      position: absolute;
      z-index: 9;
      display: none;
      width: 90px;
      height: 90px;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .arrowLine {
      position: absolute;
      width: 60px;
      height: 6px;
      left: 10px;
      top: 55px;
      background: #ff0000;
      border-radius: 2px;
      transform: rotate(-45deg);
      transform-origin: right center;
      box-shadow: 0 1px 3px #000;
    }
    .arrowHead {
      position: absolute;
      width: 0;
      height: 0;
      left: 56px;
      top: 10px;
      border-left: 18px solid #ff0000;
      border-top: 10px solid transparent;
      border-bottom: 10px solid transparent;
      transform: rotate(-45deg);
    }

    /* 操作エリア */
    .controls-panel {
      padding: 6px 8px 12px;
      background: var(--win-bg);
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--win-light);
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
    }

    .shutter-wrapper {
      display: flex;
      justify-content: center;
      margin-top: 4px;
    }
    .shutter-btn-win {
      width: 100%;
      height: 48px;
      font-size: 16px;
      font-weight: bold;
      background: var(--win-bg);
    }

    /* 全画面モーダル（ダイアログ風） */
    .win-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      background: rgba(0,0,0,0.5);
      padding: 8px;
    }
    .win-modal.show { display: flex; }

    .win-modal-window {
      width: 100%;
      height: 100%;
      background: var(--win-bg);
      display: flex;
      flex-direction: column;
      border: 3px solid;
      border-color: var(--win-light) var(--win-dark) var(--win-dark) var(--win-light);
      box-shadow: 2px 2px 0 var(--win-dark);
    }

    .win-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px;
      background: #ffffff;
      margin: 4px;
    }

    /* ギャラリーアイテム */
    .photo-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px;
      border-bottom: 1px dotted var(--win-shadow);
      background: #fff;
      color: #000;
    }
    .photo-row:nth-child(even) {
      background: #f8f8f8;
    }
    .photo-thumb {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border: 1px solid var(--win-dark);
    }

    .modal-bottom {
      padding: 6px;
      background: var(--win-bg);
      border-top: 1px solid var(--win-light);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* テキスト入力 */
    .win-input {
      width: 100%;
      height: 32px;
      padding: 0 6px;
      background: #fff;
      border: 2px solid;
      border-color: var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow);
      font-family: var(--win-font);
      font-size: 14px;
      outline: none;
    }

    /* トーストメッセージ */
    #message {
      position: fixed;
      left: 50%;
      bottom: 120px;
      transform: translateX(-50%);
      z-index: 200;
      display: none;
      padding: 6px 14px;
      background: #ffffe1; /* 黄色いツールチップ風 */
      color: #000;
      border: 1px solid #000;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.4);
      font-size: 12px;
    }
  </style>
</head>

<body>

<div id="app">

  <!-- Windows 95 タイトルバー -->
  <div class="title-bar">
    <div class="title-bar-text">
      <span>💾</span>
      <span>現場写真.exe</span>
    </div>
    <div class="title-bar-controls">
      <button class="title-btn" id="galleryButton" title="写真一覧">📁</button>
      <button class="title-btn" id="settingsButton" title="プロパティ">⚙</button>
      <button class="title-btn" onclick="location.reload()">✕</button>
    </div>
  </div>

  <!-- メニューバー -->
  <div class="menu-bar">
    <div class="menu-item" id="menuPhotos"><u>F</u>写真一覧</div>
    <div class="menu-item" id="menuSettings"><u>O</u>オプション</div>
    <div class="menu-item" onclick="showMessage('現場カメラ Win95版 v1.0')"><u>H</u>バージョン</div>
  </div>

  <!-- カメラステージ（Sunken Inset） -->
  <main id="cameraStage" class="win-inset">
    <video id="video" autoplay playsinline webkit-playsinline muted></video>

    <!-- カメラ起動ダイアログ -->
    <div id="cameraStart">
      <div class="dialog-box">
        <div class="title-bar">
          <div class="title-bar-text">📷 カメラの起動</div>
        </div>
        <div class="dialog-content">
          <p>現場写真を撮影するために<br>カメラデバイスを初期化します。</p>
          <button class="win-btn" id="startCameraButton" style="width:120px; height:32px;">実行 (<u>O</u>K)</button>
        </div>
      </div>
    </div>

    <!-- カメラエラーダイアログ -->
    <div id="cameraError">
      <div class="dialog-box">
        <div class="title-bar" style="background:#800000;">
          <div class="title-bar-text">⚠️ システム エラー</div>
        </div>
        <div class="dialog-content">
          <p id="cameraErrorText">カメラにアクセスできません。</p>
          <button class="win-btn" id="retryButton" style="width:100px;">再試行(<u>R</u>)</button>
        </div>
      </div>
    </div>

    <!-- スタンプ -->
    <div id="stampPreview"></div>

    <!-- 矢印 -->
    <div id="arrowPreview">
      <div class="arrowLine"></div>
      <div class="arrowHead"></div>
    </div>
  </main>

  <!-- 下部操作パネル -->
  <section class="controls-panel">
    <div class="tools-grid">
      <button class="win-btn toolButton" data-stamp="作業前">作業前</button>
      <button class="win-btn toolButton" data-stamp="作業中">作業中</button>
      <button class="win-btn toolButton" data-stamp="作業後">作業後</button>
      <button class="win-btn toolButton" id="arrowButton">➜ 矢印</button>
    </div>

    <div class="shutter-wrapper">
      <button class="win-btn shutter-btn-win" id="captureButton">
        📸 撮影を実行 (<u>S</u>nap)
      </button>
    </div>
  </section>

</div>

<!-- 📁 ギャラリーウィンドウ（エクスプローラー風） -->
<section id="gallery" class="win-modal">
  <div class="win-modal-window">
    <div class="title-bar">
      <div class="title-bar-text">📁 撮影済みファイル一覧</div>
      <button class="title-btn" id="closeGallery">✕</button>
    </div>
    <div class="win-modal-body win-inset" id="galleryList"></div>
    
    <div class="modal-bottom">
      <input id="jobNumber" class="win-input" type="text" placeholder="受付番号を入力 (例: 26H0043982)">
      <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:6px;">
        <button class="win-btn" id="btnSelectAllToggle">全選択/解除</button>
        <button class="win-btn" id="sendButton" style="font-weight:bold; background:#e0e0e0;">
          ✉ 選択ファイルを送信/共有
        </button>
      </div>
    </div>
  </div>
</section>

<!-- ⚙ 設定ウィンドウ（プロパティ風） -->
<section id="settings" class="win-modal">
  <div class="win-modal-window">
    <div class="title-bar">
      <div class="title-bar-text">⚙ システムのプロパティ</div>
      <button class="title-btn" id="closeSettings">✕</button>
    </div>
    
    <div class="win-modal-body win-inset" style="background:var(--win-bg); display:flex; flex-direction:column; gap:12px;">
      <fieldset style="border:2px solid; border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow); padding:8px;">
        <legend style="padding:0 4px; font-weight:bold;">スタンプの刻印位置</legend>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:4px;">
          <button class="win-btn" data-position="top-left">左上</button>
          <button class="win-btn" data-position="top-right">右上</button>
          <button class="win-btn" data-position="bottom-left">左下</button>
          <button class="win-btn" data-position="bottom-right">右下</button>
        </div>
      </fieldset>

      <fieldset style="border:2px solid; border-color:var(--win-shadow) var(--win-light) var(--win-light) var(--win-shadow); padding:8px;">
        <legend style="padding:0 4px; font-weight:bold;">矢印スタンプの倍率</legend>
        <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; margin-top:4px;">
          <button class="win-btn" data-arrow-size="0.7">70%</button>
          <button class="win-btn" data-arrow-size="1">100%</button>
          <button class="win-btn" data-arrow-size="1.4">140%</button>
          <button class="win-btn" data-arrow-size="1.8">180%</button>
        </div>
      </fieldset>
    </div>

    <div class="modal-bottom" style="display:flex; justify-content:flex-end;">
      <button class="win-btn" id="closeSettingsBtn" style="width:80px;">OK</button>
    </div>
  </div>
</section>

<!-- トースト -->
<div id="message"></div>

<script>
/* =========================================================
   ロジック部（完全動作版）
========================================================= */
const video = document.getElementById("video");
const cameraStage = document.getElementById("cameraStage");
const cameraStart = document.getElementById("cameraStart");
const cameraError = document.getElementById("cameraError");
const cameraErrorText = document.getElementById("cameraErrorText");
const startCameraButton = document.getElementById("startCameraButton");
const retryButton = document.getElementById("retryButton");
const captureButton = document.getElementById("captureButton");
const stampPreview = document.getElementById("stampPreview");
const arrowPreview = document.getElementById("arrowPreview");
const gallery = document.getElementById("gallery");
const settings = document.getElementById("settings");

let stream = null;
let cameraStarted = false;
let currentStamp = null;
let stampPosition = localStorage.getItem("stampPosition") || "top-right";
let arrowSize = Number(localStorage.getItem("arrowSize") || "1");
let arrowPoint = null;
let draggingArrow = false;
let photos = [];

window.addEventListener("load", function() {
  setupEvents();
  updateSettingsUI();
  updateStampPreview();
  cameraStart.style.display = "flex";
});

function setupEvents() {
  startCameraButton.addEventListener("click", startCamera);
  retryButton.addEventListener("click", startCamera);

  document.querySelectorAll("[data-stamp]").forEach(btn => {
    btn.addEventListener("click", function() {
      selectStamp(this.dataset.stamp);
    });
  });

  document.getElementById("arrowButton").addEventListener("click", selectArrow);
  captureButton.addEventListener("click", capturePhoto);

  // ギャラリー開閉
  document.getElementById("galleryButton").addEventListener("click", openGallery);
  document.getElementById("menuPhotos").addEventListener("click", openGallery);
  document.getElementById("closeGallery").addEventListener("click", closeGallery);

  // 設定開閉
  document.getElementById("settingsButton").addEventListener("click", openSettings);
  document.getElementById("menuSettings").addEventListener("click", openSettings);
  document.getElementById("closeSettings").addEventListener("click", closeSettings);
  document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);

  // 設定項目
  document.querySelectorAll("[data-position]").forEach(btn => {
    btn.addEventListener("click", function() { setStampPosition(this.dataset.position); });
  });
  document.querySelectorAll("[data-arrow-size]").forEach(btn => {
    btn.addEventListener("click", function() { setArrowSize(Number(this.dataset.arrowSize)); });
  });

  // 矢印ドラッグ操作
  cameraStage.addEventListener("pointerdown", arrowPointerDown);
  cameraStage.addEventListener("pointermove", arrowPointerMove);
  cameraStage.addEventListener("pointerup", arrowPointerUp);
  cameraStage.addEventListener("pointercancel", arrowPointerUp);

  // 共有
  document.getElementById("sendButton").addEventListener("click", sendSelectedPhotos);

  // 全選択トグル
  document.getElementById("btnSelectAllToggle").addEventListener("click", () => {
    const hasUnchecked = photos.some(p => !p.selected);
    photos.forEach(p => p.selected = hasUnchecked);
    renderGallery();
  });
}

/* カメラ起動 */
async function startCamera() {
  cameraStart.style.display = "none";
  cameraError.style.display = "none";

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraError("このブラウザではカメラAPIを利用できません。");
    return;
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.muted = true;
    await video.play();

    cameraStarted = true;
    showMessage("カメラデバイス準備完了");
  } catch (error) {
    console.error(error);
    showCameraError("カメラを起動できませんでした (" + error.name + ")");
  }
}

function showCameraError(text) {
  cameraStart.style.display = "none";
  cameraError.style.display = "flex";
  cameraErrorText.textContent = text;
}

/* スタンプ & 矢印 */
function selectStamp(label) {
  currentStamp = label;
  arrowPoint = null;
  draggingArrow = false;
  arrowPreview.style.display = "none";

  document.querySelectorAll(".toolButton").forEach(b => b.classList.remove("active"));
  const target = document.querySelector('[data-stamp="' + label + '"]');
  if (target) target.classList.add("active");

  stampPreview.textContent = label;
  stampPreview.style.display = "block";
  updateStampPreview();
}

function selectArrow() {
  currentStamp = null;
  stampPreview.style.display = "none";
  document.querySelectorAll(".toolButton").forEach(b => b.classList.remove("active"));
  document.getElementById("arrowButton").classList.add("active");

  if (!arrowPoint) {
    showMessage("画面をタップして矢印を配置してください");
  }
}

function updateStampPreview() {
  if (!currentStamp) {
    stampPreview.style.display = "none";
    return;
  }
  const m = 12;
  stampPreview.style.left = "auto";
  stampPreview.style.right = "auto";
  stampPreview.style.top = "auto";
  stampPreview.style.bottom = "auto";

  if (stampPosition === "top-left") { stampPreview.style.left = m + "px"; stampPreview.style.top = m + "px"; }
  else if (stampPosition === "top-right") { stampPreview.style.right = m + "px"; stampPreview.style.top = m + "px"; }
  else if (stampPosition === "bottom-left") { stampPreview.style.left = m + "px"; stampPreview.style.bottom = m + "px"; }
  else if (stampPosition === "bottom-right") { stampPreview.style.right = m + "px"; stampPreview.style.bottom = m + "px"; }
}

function arrowPointerDown(event) {
  const arrowButton = document.getElementById("arrowButton");
  if (!arrowButton.classList.contains("active") || !cameraStarted) return;

  event.preventDefault();
  const point = getStagePoint(event);

  if (arrowPoint) {
    const dx = point.x - arrowPoint.x;
    const dy = point.y - arrowPoint.y;
    if (Math.sqrt(dx * dx + dy * dy) < 70) {
      draggingArrow = true;
      try { cameraStage.setPointerCapture(event.pointerId); } catch(e) {}
      return;
    }
  }

  arrowPoint = { x: point.x, y: point.y };
  draggingArrow = true;
  try { cameraStage.setPointerCapture(event.pointerId); } catch(e) {}
  updateArrowPreview();
}

function arrowPointerMove(event) {
  if (!draggingArrow) return;
  event.preventDefault();
  const point = getStagePoint(event);
  arrowPoint = { x: point.x, y: point.y };
  updateArrowPreview();
}

function arrowPointerUp() { draggingArrow = false; }

function getStagePoint(event) {
  const rect = cameraStage.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(rect.width, event.clientX - rect.left)),
    y: Math.max(0, Math.min(rect.height, event.clientY - rect.top))
  };
}

function updateArrowPreview() {
  if (!arrowPoint) { arrowPreview.style.display = "none"; return; }
  arrowPreview.style.display = "block";
  arrowPreview.style.left = arrowPoint.x + "px";
  arrowPreview.style.top = arrowPoint.y + "px";
  arrowPreview.style.transform = "translate(-50%, -50%) scale(" + arrowSize + ")";
}

/* 撮影 & 焼き込み */
function capturePhoto() {
  if (!cameraStarted || !video.videoWidth || !video.videoHeight) {
    showMessage("カメラが準備できていません");
    return;
  }

  const width = video.videoWidth;
  const height = video.videoHeight;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  ctx.drawImage(video, 0, 0, width, height);

  if (currentStamp) drawStamp(ctx, currentStamp, width, height);
  if (arrowPoint) {
    const source = stageToSource(arrowPoint.x, arrowPoint.y);
    drawArrowOnPhoto(ctx, source.x, source.y, width, height);
  }

  canvas.toBlob(function(blob) {
    if (!blob) { showMessage("写真の保存に失敗しました"); return; }
    photos.unshift({
      id: Date.now(),
      blob: blob,
      stamp: currentStamp || "未指定",
      created: new Date(),
      selected: true
    });
    showMessage("写真ファイルを保存しました");
  }, "image/jpeg", 0.92);
}

function stageToSource(stageX, stageY) {
  const stageW = cameraStage.clientWidth;
  const stageH = cameraStage.clientHeight;
  const sourceW = video.videoWidth;
  const sourceH = video.videoHeight;

  const scale = Math.max(stageW / sourceW, stageH / sourceH);
  const renderW = sourceW * scale;
  const renderH = sourceH * scale;
  const offsetX = (stageW - renderW) / 2;
  const offsetY = (stageH - renderH) / 2;

  return {
    x: Math.max(0, Math.min(sourceW, (stageX - offsetX) / scale)),
    y: Math.max(0, Math.min(sourceH, (stageY - offsetY) / scale))
  };
}

function drawStamp(ctx, label, width, height) {
  const fontSize = Math.max(36, Math.round(width * 0.035));
  ctx.font = "bold " + fontSize + "px sans-serif";
  const pad = fontSize * 0.35;
  const textWidth = ctx.measureText(label).width;
  const boxW = textWidth + pad * 2;
  const boxH = fontSize + pad * 2;
  const margin = Math.round(width * 0.025);

  let x = margin;
  let y = margin;
  if (stampPosition === "top-right") { x = width - boxW - margin; y = margin; }
  else if (stampPosition === "bottom-left") { x = margin; y = height - boxH - margin; }
  else if (stampPosition === "bottom-right") { x = width - boxW - margin; y = height - boxH - margin; }

  ctx.fillStyle = "rgba(0,0,0,.75)";
  ctx.fillRect(x, y, boxW, boxH);
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = Math.max(3, width * 0.003);
  ctx.strokeRect(x, y, boxW, boxH);

  ctx.fillStyle = "#fff";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + pad, y + boxH / 2);
}

function drawArrowOnPhoto(ctx, x, y, width, height) {
  const len = Math.min(width, height) * 0.16 * arrowSize;
  const lw = Math.max(6, width * 0.006) * arrowSize;
  const startX = x - len;
  const startY = y + len;
  const angle = Math.atan2(y - startY, x - startX);

  ctx.save();
  ctx.strokeStyle = "#ff0000";
  ctx.fillStyle = "#ff0000";
  ctx.lineWidth = lw;
  ctx.lineCap = "round";

  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(x, y);
  ctx.stroke();

  const head = len * 0.32;
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x - head * Math.cos(angle - Math.PI / 6), y - head * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(x - head * Math.cos(angle + Math.PI / 6), y - head * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

/* ギャラリー一覧 */
function openGallery() {
  gallery.classList.add("show");
  renderGallery();
}
function closeGallery() { gallery.classList.remove("show"); }

function renderGallery() {
  const list = document.getElementById("galleryList");
  list.innerHTML = "";

  if (photos.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding:30px; color:#808080;">ファイルが存在しません。</div>`;
    return;
  }

  photos.forEach(photo => {
    const row = document.createElement("div");
    row.className = "photo-row";

    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = photo.selected;
    chk.style.transform = "scale(1.2)";
    chk.addEventListener("change", () => { photo.selected = chk.checked; });

    const img = document.createElement("img");
    img.className = "photo-thumb";
    img.src = URL.createObjectURL(photo.blob);

    const info = document.createElement("div");
    info.style.flex = "1";
    info.innerHTML = `<strong>${photo.stamp}</strong><br><small style="color:#666;">${formatTime(photo.created)}</small>`;

    const delBtn = document.createElement("button");
    delBtn.className = "win-btn";
    delBtn.textContent = "削除";
    delBtn.style.padding = "2px 8px";
    delBtn.addEventListener("click", () => {
      if (confirm("このファイルを削除しますか？")) {
        photos = photos.filter(p => p.id !== photo.id);
        renderGallery();
      }
    });

    row.appendChild(chk);
    row.appendChild(img);
    row.appendChild(info);
    row.appendChild(delBtn);
    list.appendChild(row);
  });
}

function formatTime(date) {
  const d = new Date(date);
  return d.getHours().toString().padStart(2,"0") + ":" +
         d.getMinutes().toString().padStart(2,"0") + ":" +
         d.getSeconds().toString().padStart(2,"0");
}

/* 設定 */
function openSettings() { settings.classList.add("show"); updateSettingsUI(); }
function closeSettings() { settings.classList.remove("show"); }

function setStampPosition(pos) {
  stampPosition = pos;
  localStorage.setItem("stampPosition", pos);
  updateSettingsUI();
  updateStampPreview();
  showMessage("位置設定を更新しました");
}

function setArrowSize(size) {
  arrowSize = size;
  localStorage.setItem("arrowSize", String(size));
  updateSettingsUI();
  updateArrowPreview();
  showMessage("矢印サイズを更新しました");
}

function updateSettingsUI() {
  document.querySelectorAll("[data-position]").forEach(b => {
    b.classList.toggle("selected", b.dataset.position === stampPosition);
  });
  document.querySelectorAll("[data-arrow-size]").forEach(b => {
    b.classList.toggle("selected", Number(b.dataset.arrowSize) === arrowSize);
  });
}

/* 共有・送信 */
async function sendSelectedPhotos() {
  const selected = photos.filter(p => p.selected);
  if (selected.length === 0) {
    showMessage("対象ファイルを選択してください");
    return;
  }

  const jobNumber = document.getElementById("jobNumber").value.trim();
  if (!jobNumber) {
    showMessage("受付番号を入力してください");
    return;
  }

  const subject = "受付番号: " + jobNumber + " 現場写真報告分";
  const files = [];

  for (let i = 0; i < selected.length; i++) {
    const photo = selected[i];
    const buffer = await photo.blob.arrayBuffer();
    files.push(new File([buffer], `現場写真_${jobNumber}_${String(i+1).padStart(2,"0")}.jpg`, { type: "image/jpeg" }));
  }

  if (navigator.share && navigator.canShare && navigator.canShare({ files: files })) {
    try {
      await navigator.share({ title: subject, text: subject, files: files });
      showMessage("送信ダイアログを開きました");
    } catch(e) {}
    return;
  }

  showMessage("お使いの環境ではファイル共有機能を利用できません");
}

let messageTimer = null;
function showMessage(text) {
  const msg = document.getElementById("message");
  msg.textContent = text;
  msg.style.display = "block";
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => { msg.style.display = "none"; }, 2500);
}
</script>
