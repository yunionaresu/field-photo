<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ROCKMAN 現場 CAMERA</title>

  <!-- Google Fonts: 8bitレトロドットフォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">

  <style>
    /* =========================================================
       ファミコン / ロックマン風 8-bit カラーパレット
    ========================================================= */
    :root {
      --nes-black: #000000;
      --nes-white: #ffffff;
      --rock-blue-light: #00fcfc; /* シアン */
      --rock-blue-mid: #0078f8;   /* ロックマンブルー */
      --rock-blue-dark: #0000a8;  /* ダークネイビー */
      --rock-yellow: #f8b800;     /* エネルギー黄色 */
      --rock-red: #f83800;        /* ボス赤 */
      --pixel-font: "DotGothic16", monospace, sans-serif;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      image-rendering: pixelated;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: var(--nes-black);
      color: var(--nes-white);
      font-family: var(--pixel-font);
      overflow: hidden;
      overscroll-behavior: none;
      font-size: 14px;
    }

    body {
      touch-action: manipulation;
    }

    /* ロックマン風 2重ピクセルボーダー */
    .nes-box {
      background: var(--nes-black);
      border: 4px solid var(--nes-white);
      box-shadow:
        0 0 0 2px var(--nes-black),
        inset 0 0 0 2px var(--rock-blue-mid);
      position: relative;
    }

    /* ピクセルボタン */
    .nes-btn {
      background: var(--rock-blue-dark);
      color: var(--nes-white);
      border: 3px solid var(--nes-white);
      box-shadow: inset -3px -3px 0px 0px rgba(0,0,0,0.6), inset 3px 3px 0px 0px var(--rock-blue-light);
      font-family: var(--pixel-font);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      letter-spacing: 1px;
      text-transform: uppercase;
      outline: none;
    }
    .nes-btn:active {
      transform: scale(0.96);
      background: var(--rock-blue-mid);
    }
    .nes-btn.active, .nes-btn.selected {
      background: var(--rock-yellow);
      color: var(--nes-black);
      border-color: var(--nes-white);
      box-shadow: inset -3px -3px 0px 0px #885500, inset 3px 3px 0px 0px #fff;
    }

    #app {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: #000020;
      padding: 6px;
      gap: 6px;
    }

    /* ヘッダー */
    .header {
      height: 48px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--rock-blue-dark);
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      color: var(--rock-blue-light);
      text-shadow: 2px 2px 0px var(--nes-black);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .header-right {
      display: flex;
      gap: 6px;
    }
    .header-btn {
      height: 32px;
      padding: 0 8px;
      font-size: 12px;
    }

    /* カメラファインダー */
    #cameraStage {
      position: relative;
      flex: 1;
      min-height: 0;
      background: var(--nes-black);
      overflow: hidden;
      touch-action: none;
    }
    #video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      pointer-events: none;
    }

    /* 起動・エラーダイアログ */
    #cameraStart, #cameraError {
      position: absolute;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: rgba(0, 0, 0, 0.85);
    }
    .dialog-inner {
      width: 100%;
      max-width: 320px;
      padding: 20px 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* スタンプ（ピクセルバッジ） */
    #stampPreview {
      position: absolute;
      z-index: 8;
      display: none;
      padding: 6px 12px;
      border: 3px solid var(--nes-white);
      background: var(--nes-black);
      color: var(--rock-blue-light);
      font-size: 16px;
      font-weight: 700;
      box-shadow: 3px 3px 0px var(--nes-black);
      pointer-events: none;
      white-space: nowrap;
    }

    /* ★ 修正済み: 一体型SVG矢印プレビュー */
    #arrowPreview {
      position: absolute;
      z-index: 9;
      display: none;
      width: 80px;
      height: 80px;
      pointer-events: none;
      /* 中心ではなく、矢じり先端(右上)がターゲットに合うようオフセット */
      transform: translate(-70%, -20%);
    }
    .arrow-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(2px 2px 0px #000);
    }

    /* 下部コントロール */
    .controls-panel {
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
      background: var(--rock-blue-dark);
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .shutter-btn {
      width: 100%;
      height: 52px;
      background: var(--rock-blue-mid);
      color: var(--nes-white);
      border: 4px solid var(--nes-white);
      font-size: 17px;
      letter-spacing: 2px;
      box-shadow: inset -4px -4px 0px 0px #000060, inset 4px 4px 0px 0px var(--rock-blue-light);
    }
    .shutter-btn:active {
      background: var(--rock-yellow);
      color: var(--nes-black);
      box-shadow: inset -4px -4px 0px 0px #885500, inset 4px 4px 0px 0px #fff;
    }

    /* 全画面モーダル */
    .nes-modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      flex-direction: column;
      background: rgba(0, 0, 0, 0.85);
      padding: 10px;
    }
    .nes-modal.show { display: flex; }

    .modal-frame {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      height: 46px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--rock-blue-dark);
      border-bottom: 3px solid var(--nes-white);
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ギャラリーアイテム */
    .photo-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      background: #000030;
      border: 2px solid var(--rock-blue-mid);
    }
    .photo-thumb {
      width: 64px;
      height: 64px;
      object-fit: cover;
      border: 2px solid var(--nes-white);
    }

    .modal-bottom {
      padding: 10px;
      background: var(--rock-blue-dark);
      border-top: 3px solid var(--nes-white);
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-bottom: calc(10px + env(safe-area-inset-bottom));
    }

    .nes-input {
      width: 100%;
      height: 42px;
      padding: 0 10px;
      background: var(--nes-black);
      color: var(--rock-yellow);
      border: 3px solid var(--nes-white);
      font-family: var(--pixel-font);
      font-size: 15px;
      outline: none;
    }

    /* トーストメッセージ */
    #message {
      position: fixed;
      left: 50%;
      bottom: 140px;
      transform: translateX(-50%);
      z-index: 200;
      display: none;
      padding: 8px 16px;
      background: var(--nes-black);
      color: var(--rock-yellow);
      border: 3px solid var(--nes-white);
      box-shadow: 4px 4px 0px #000;
      font-size: 14px;
      text-align: center;
      white-space: nowrap;
    }
  </style>
</head>

<body>

<div id="app">

  <!-- ヘッダー -->
  <header class="header nes-box">
    <div class="title">
      <span>⚡</span> ROCK-CAM <span>STAGE</span>
    </div>
    <div class="header-right">
      <button class="nes-btn header-btn" id="galleryButton">ITEM (<span id="photoCount">0</span>)</button>
      <button class="nes-btn header-btn" id="settingsButton">OPT</button>
    </div>
  </header>

  <!-- カメラファインダー -->
  <main id="cameraStage" class="nes-box">
    <video id="video" autoplay playsinline webkit-playsinline muted></video>

    <!-- 起動画面 -->
    <div id="cameraStart">
      <div class="dialog-inner nes-box">
        <div style="font-size:32px; color:var(--rock-blue-light);">READY!</div>
        <p style="line-height:1.6; font-size:13px;">現場カメラシステムヲ<br>キドウシテクダサイ</p>
        <button class="nes-btn" id="startCameraButton" style="padding:10px 20px; font-size:15px;">START (カメラ起動)</button>
      </div>
    </div>

    <!-- エラー画面 -->
    <div id="cameraError">
      <div class="dialog-inner nes-box">
        <div style="font-size:24px; color:var(--rock-red);">WARNING!</div>
        <p id="cameraErrorText" style="line-height:1.6; font-size:12px;"></p>
        <button class="nes-btn" id="retryButton">RETRY (再試行)</button>
      </div>
    </div>

    <!-- スタンプ -->
    <div id="stampPreview"></div>

    <!-- ★ 一体型SVG矢印プレビュー（ズレ・分裂ゼロ） -->
    <div id="arrowPreview">
      <svg viewBox="0 0 100 100" class="arrow-svg">
        <!-- 白フチ -->
        <line x1="20" y1="80" x2="72" y2="28" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>
        <!-- 赤の本体軸線 -->
        <line x1="20" y1="80" x2="72" y2="28" stroke="#f83800" stroke-width="8" stroke-linecap="round"/>
        <!-- 矢じり三角形（白枠付き赤） -->
        <polygon points="50,15 90,10 85,50" fill="#f83800" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round"/>
      </svg>
    </div>
  </main>

  <!-- 操作パネル -->
  <section class="controls-panel nes-box">
    <div class="tools-grid">
      <button class="nes-btn toolButton" data-stamp="作業前">作業前</button>
      <button class="nes-btn toolButton" data-stamp="作業中">作業中</button>
      <button class="nes-btn toolButton" data-stamp="作業後">作業後</button>
      <button class="nes-btn toolButton" id="arrowButton">➔ 矢印</button>
    </div>

    <button class="nes-btn shutter-btn" id="captureButton">
      ⚡ SHOT / 撮影
    </button>
  </section>

</div>

<!-- 📁 ギャラリーウィンドウ -->
<section id="gallery" class="nes-modal">
  <div class="modal-frame nes-box">
    <div class="modal-header">
      <div style="color:var(--rock-blue-light); font-weight:bold;">📁 ITEM LIST (撮影一覧)</div>
      <button class="nes-btn header-btn" id="closeGallery">✕</button>
    </div>
    
    <div class="modal-body" id="galleryList"></div>
    
    <div class="modal-bottom">
      <input id="jobNumber" class="nes-input" type="text" placeholder="受付番号 (例: 26H0043982)">
      <div style="display:grid; grid-template-columns: 1fr 1.6fr; gap:6px;">
        <button class="nes-btn" id="btnSelectAllToggle">全選択/解除</button>
        <button class="nes-btn" id="sendButton" style="background:var(--rock-yellow); color:#000;">
          ☑ TRANSMIT (共有)
        </button>
      </div>
    </div>
  </div>
</section>

<!-- ⚙ 設定ウィンドウ -->
<section id="settings" class="nes-modal">
  <div class="modal-frame nes-box">
    <div class="modal-header">
      <div style="color:var(--rock-blue-light); font-weight:bold;">⚙ CONFIG (設定)</div>
      <button class="nes-btn header-btn" id="closeSettings">✕</button>
    </div>
    
    <div class="modal-body">
      <div style="display:flex; flex-direction:column; gap:6px;">
        <label style="color:var(--rock-yellow);">[ スタンプ イチ ]</label>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:6px;">
          <button class="nes-btn" data-position="top-left">ヒダリウエ</button>
          <button class="nes-btn" data-position="top-right">ミギウエ</button>
          <button class="nes-btn" data-position="bottom-left">ヒダリシタ</button>
          <button class="nes-btn" data-position="bottom-right">ミギシタ</button>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px; margin-top:10px;">
        <label style="color:var(--rock-yellow);">[ ヤジルシ サイズ ]</label>
        <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:4px;">
          <button class="nes-btn" data-arrow-size="0.7">S</button>
          <button class="nes-btn" data-arrow-size="1">M</button>
          <button class="nes-btn" data-arrow-size="1.4">L</button>
          <button class="nes-btn" data-arrow-size="1.8">XL</button>
        </div>
      </div>
    </div>

    <div class="modal-bottom">
      <button class="nes-btn" id="closeSettingsBtn" style="width:100%;">OK (完了)</button>
    </div>
  </div>
</section>

<!-- トースト -->
<div id="message"></div>

<script>
/* =========================================================
   ロジック部（矢印バグ修正＆完全動作）
========================================================= */
const video = document.getElementById("video");
const cameraStage = document.getElementById("cameraStage");
const cameraStart = document.getElementById("cameraStart");
const cameraError = document.getElementById("cameraError");
const cameraErrorText = document.getElementById("cameraErrorText");
const startCameraButton = document.getElementById("startCameraButton");
const retryButton = document.getElementById("retryButton");
const captureButton = document.getElementById("captureButton");
const stampPreview = document.getElementById("stampPreview");
const arrowPreview = document.getElementById("arrowPreview");
const gallery = document.getElementById("gallery");
const settings = document.getElementById("settings");
const photoCount = document.getElementById("photoCount");

let stream = null;
let cameraStarted = false;
let currentStamp = null;
let stampPosition = localStorage.getItem("stampPosition") || "top-right";
let arrowSize = Number(localStorage.getItem("arrowSize") || "1");
let arrowPoint = null;
let draggingArrow = false;
let photos = [];

window.addEventListener("load", function() {
  setupEvents();
  updateSettingsUI();
  updateStampPreview();
  cameraStart.style.display = "flex";
});

function setupEvents() {
  startCameraButton.addEventListener("click", startCamera);
  retryButton.addEventListener("click", startCamera);

  document.querySelectorAll("[data-stamp]").forEach(btn => {
    btn.addEventListener("click", function() {
      selectStamp(this.dataset.stamp);
    });
  });

  document.getElementById("arrowButton").addEventListener("click", selectArrow);
  captureButton.addEventListener("click", capturePhoto);

  document.getElementById("galleryButton").addEventListener("click", openGallery);
  document.getElementById("closeGallery").addEventListener("click", closeGallery);
  document.getElementById("settingsButton").addEventListener("click", openSettings);
  document.getElementById("closeSettings").addEventListener("click", closeSettings);
  document.getElementById("closeSettingsBtn").addEventListener("click", closeSettings);

  document.querySelectorAll("[data-position]").forEach(btn => {
    btn.addEventListener("click", function() { setStampPosition(this.dataset.position); });
  });
  document.querySelectorAll("[data-arrow-size]").forEach(btn => {
    btn.addEventListener("click", function() { setArrowSize(Number(this.dataset.arrowSize)); });
  });

  cameraStage.addEventListener("pointerdown", arrowPointerDown);
  cameraStage.addEventListener("pointermove", arrowPointerMove);
  cameraStage.addEventListener("pointerup", arrowPointerUp);
  cameraStage.addEventListener("pointercancel", arrowPointerUp);

  document.getElementById("sendButton").addEventListener("click", sendSelectedPhotos);

  document.getElementById("btnSelectAllToggle").addEventListener("click", () => {
    const hasUnchecked = photos.some(p => !p.selected);
    photos.forEach(p => p.selected = hasUnchecked);
    renderGallery();
  });
}

/* カメラ起動 */
async function startCamera() {
  cameraStart.style.display = "none";
  cameraError.style.display = "none";

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showCameraError("カメラAPIヲ リヨウデキマセン");
    return;
  }

  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: "environment" } },
      audio: false
    });

    video.srcObject = stream;
    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");
    video.muted = true;
    await video.play();

    cameraStarted = true;
    showMessage("CAMERA READY!");
  } catch (error) {
    console.error(error);
    showCameraError("カメラキドウ エラー: " + error.name);
  }
}

function showCameraError(text) {
  cameraStart.style.display = "none";
  cameraError.style.display = "flex";
  cameraErrorText.textContent = text;
}

/* スタンプ & 矢印選択 */
function selectStamp(label) {
  currentStamp = label;
  arrowPoint = null;
  draggingArrow = false;
  arrowPreview.style.display = "none";

  document.querySelectorAll(".toolButton").forEach(b => b.classList.remove("active"));
  const target = document.querySelector('[data-stamp="' + label + '"]');
  if (target) target.classList.add("active");

  stampPreview.textContent = label;
  stampPreview.style.display = "block";
  updateStampPreview();
}

function selectArrow() {
  currentStamp = null;
  stampPreview.style.display = "none";
  document.querySelectorAll(".toolButton").forEach(b => b.classList.remove("active"));
  document.getElementById("arrowButton").classList.add("active");

  if (!arrowPoint) {
    showMessage("ガメンヲ タップシテ ヤジルシヲ ハイチ");
  }
}

function updateStampPreview() {
  if (!currentStamp) {
    stampPreview.style.display = "none";
    return;
  }
  const m = 10;
  stampPreview.style.left = "auto";
  stampPreview.style.right = "auto";
  stampPreview.style.top = "auto";
  stampPreview.style.bottom = "auto";

  if (stampPosition === "top-left") { stampPreview.style.left = m + "px"; stampPreview.style.top = m + "px"; }
  else if (stampPosition === "top-right") { stampPreview.style.right = m + "px"; stampPreview.style.top = m + "px"; }
  else if (stampPosition === "bottom-left") { stampPreview.style.left = m + "px"; stampPreview.style.bottom = m + "px"; }
  else if (stampPosition === "bottom-right") { stampPreview.style.right = m + "px"; stampPreview.style.bottom = m + "px"; }
}

/* 矢印ドラッグ操作（精密補正） */
function arrowPointerDown(event) {
  const arrowButton = document.getElementById("arrowButton");
  if (!arrowButton.classList.contains("active") || !cameraStarted) return;

  event.preventDefault();
  const point = getStagePoint(event);

  if (arrowPoint) {
    const dx = point.x - arrowPoint.x;
    const dy = point.y - arrowPoint.y;
    if (Math.sqrt(dx * dx + dy * dy) < 80) {
      draggingArrow = true;
      try { cameraStage.setPointerCapture(event.pointerId); } catch(e) {}
      return;
    }
  }

  arrowPoint = { x: point.x, y: point.y };
  draggingArrow = true;
  try { cameraStage.setPointerCapture(event.pointerId); } catch(e) {}
  updateArrowPreview();
}

function arrowPointerMove(event) {
  if (!draggingArrow) return;
  event.preventDefault();
  const point = getStagePoint(event);
  arrowPoint = { x: point.x, y: point.y };
  updateArrowPreview();
}

function arrowPointerUp() { draggingArrow = false; }

function getStagePoint(event) {
  const rect = cameraStage.getBoundingClientRect();
  return {
    x: Math.max(0, Math.min(rect.width, event.clientX - rect.left)),
    y: Math.max(0, Math.min(rect.height, event.clientY - rect.top))
  };
}

function updateArrowPreview() {
  if (!arrowPoint) { arrowPreview.style.display = "none"; return; }
  arrowPreview.style.display = "block";
  arrowPreview.style.left = arrowPoint.x + "px";
  arrowPreview.style.top = arrowPoint.y + "px";
  arrowPreview.style.transform = `translate(-70%, -20%) scale(${arrowSize})`;
}

/* 撮影 & Canvas焼き込み（SVGと完全同期） */
function capturePhoto() {
  if (!cameraStarted || !video.videoWidth || !video.videoHeight) {
    showMessage("カメラ ジュンビチュウ");
    return;
  }

  const width = video.videoWidth;
  const height = video.videoHeight;
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext("2d");

  ctx.drawImage(video, 0, 0, width, height);

  if (currentStamp) drawStamp(ctx, currentStamp, width, height);
  if (arrowPoint) {
    const source = stageToSource(arrowPoint.x, arrowPoint.y);
    drawArrowOnPhoto(ctx, source.x, source.y, width, height);
  }

  canvas.toBlob(function(blob) {
    if (!blob) { showMessage("ホゾン シッパイ"); return; }
    photos.unshift({
      id: Date.now(),
      blob: blob,
      stamp: currentStamp || "写真",
      created: new Date(),
      selected: true
    });
    photoCount.textContent = photos.length;
    showMessage("GET ITEM! (保存完了)");
  }, "image/jpeg", 0.92);
}

function stageToSource(stageX, stageY) {
  const stageW = cameraStage.clientWidth;
  const stageH = cameraStage.clientHeight;
  const sourceW = video.videoWidth;
  const sourceH = video.videoHeight;

  const scale = Math.max(stageW / sourceW, stageH / sourceH);
  const renderW = sourceW * scale;
  const renderH = sourceH * scale;
  const offsetX = (stageW - renderW) / 2;
  const offsetY = (stageH - renderH) / 2;

  return {
    x: Math.max(0, Math.min(sourceW, (stageX - offsetX) / scale)),
    y: Math.max(0, Math.min(sourceH, (stageY - offsetY) / scale))
  };
}

function drawStamp(ctx, label, width, height) {
  const fontSize = Math.max(38, Math.round(width * 0.038));
  ctx.font = "bold " + fontSize + "px 'DotGothic16', monospace, sans-serif";
  const pad = fontSize * 0.35;
  const textWidth = ctx.measureText(label).width;
  const boxW = textWidth + pad * 2;
  const boxH = fontSize + pad * 2;
  const margin = Math.round(width * 0.025);

  let x = margin;
  let y = margin;
  if (stampPosition === "top-right") { x = width - boxW - margin; y = margin; }
  else if (stampPosition === "bottom-left") { x = margin; y = height - boxH - margin; }
  else if (stampPosition === "bottom-right") { x = width - boxW - margin; y = height - boxH - margin; }

  // ドット黒背景
  ctx.fillStyle = "#000000";
  ctx.fillRect(x, y, boxW, boxH);

  // 白ピクセル枠
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = Math.max(4, width * 0.004);
  ctx.strokeRect(x, y, boxW, boxH);

  // シアン文字
  ctx.fillStyle = "#00fcfc";
  ctx.textBaseline = "middle";
  ctx.fillText(label, x + pad, y + boxH / 2);
}

/* ★ ズレない精密矢印描画 */
function drawArrowOnPhoto(ctx, targetX, targetY, width, height) {
  const scale = (Math.min(width, height) / 1000) * arrowSize;
  const len = 90 * scale;

  // 矢じりの先端を (targetX, targetY) に一致させる
  const startX = targetX - len * 0.75;
  const startY = targetY + len * 0.75;
  const angle = Math.atan2(targetY - startY, targetX - startX);

  ctx.save();
  ctx.lineCap = "round";

  // 1. 白フチ外枠
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 14 * scale;
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(targetX - 8 * scale * Math.cos(angle), targetY - 8 * scale * Math.sin(angle));
  ctx.stroke();

  // 2. 赤の本体軸線
  ctx.strokeStyle = "#f83800";
  ctx.lineWidth = 8 * scale;
  ctx.beginPath();
  ctx.moveTo(startX, startY);
  ctx.lineTo(targetX - 8 * scale * Math.cos(angle), targetY - 8 * scale * Math.sin(angle));
  ctx.stroke();

  // 3. 矢じり三角形（白枠＋赤塗り）
  const headLen = 32 * scale;
  ctx.fillStyle = "#f83800";
  ctx.strokeStyle = "#ffffff";
  ctx.lineWidth = 3.5 * scale;
  ctx.lineJoin = "round";

  ctx.beginPath();
  ctx.moveTo(targetX, targetY);
  ctx.lineTo(targetX - headLen * Math.cos(angle - Math.PI / 6), targetY - headLen * Math.sin(angle - Math.PI / 6));
  ctx.lineTo(targetX - headLen * Math.cos(angle + Math.PI / 6), targetY - headLen * Math.sin(angle + Math.PI / 6));
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  ctx.restore();
}

/* ギャラリー一覧 */
function openGallery() { gallery.classList.add("show"); renderGallery(); }
function closeGallery() { gallery.classList.remove("show"); }

function renderGallery() {
  const list = document.getElementById("galleryList");
  list.innerHTML = "";

  if (photos.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding:40px 10px; color:var(--rock-blue-light);">ITEM GA ARIMASEN</div>`;
    return;
  }

  photos.forEach(photo => {
    const row = document.createElement("div");
    row.className = "photo-row";

    const chk = document.createElement("input");
    chk.type = "checkbox";
    chk.checked = photo.selected;
    chk.style.transform = "scale(1.3)";
    chk.addEventListener("change", () => { photo.selected = chk.checked; });

    const img = document.createElement("img");
    img.className = "photo-thumb";
    img.src = URL.createObjectURL(photo.blob);

    const info = document.createElement("div");
    info.style.flex = "1";
    info.innerHTML = `<strong style="color:var(--rock-blue-light);">${photo.stamp}</strong><br><small style="color:#aaa;">${formatTime(photo.created)}</small>`;

    const delBtn = document.createElement("button");
    delBtn.className = "nes-btn";
    delBtn.textContent = "DEL";
    delBtn.style.padding = "4px 8px";
    delBtn.style.background = "var(--rock-red)";
    delBtn.addEventListener("click", () => {
      if (confirm("コノ写真ヲ サクジョ シマスカ？")) {
        photos = photos.filter(p => p.id !== photo.id);
        photoCount.textContent = photos.length;
        renderGallery();
      }
    });

    row.appendChild(chk);
    row.appendChild(img);
    row.appendChild(info);
    row.appendChild(delBtn);
    list.appendChild(row);
  });
}

function formatTime(date) {
  const d = new Date(date);
  return d.getHours().toString().padStart(2,"0") + ":" +
         d.getMinutes().toString().padStart(2,"0") + ":" +
         d.getSeconds().toString().padStart(2,"0");
}

/* 設定 */
function openSettings() { settings.classList.add("show"); updateSettingsUI(); }
function closeSettings() { settings.classList.remove("show"); }

function setStampPosition(pos) {
  stampPosition = pos;
  localStorage.setItem("stampPosition", pos);
  updateSettingsUI();
  updateStampPreview();
  showMessage("SETTING UPDATED!");
}

function setArrowSize(size) {
  arrowSize = size;
  localStorage.setItem("arrowSize", String(size));
  updateSettingsUI();
  updateArrowPreview();
  showMessage("SIZE UPDATED!");
}

function updateSettingsUI() {
  document.querySelectorAll("[data-position]").forEach(b => {
    b.classList.toggle("selected", b.dataset.position === stampPosition);
  });
  document.querySelectorAll("[data-arrow-size]").forEach(b => {
    b.classList.toggle("selected", Number(b.dataset.arrowSize) === arrowSize);
  });
}

/* 共有送信 */
async function sendSelectedPhotos() {
  const selected = photos.filter(p => p.selected);
  if (selected.length === 0) {
    showMessage("ITEM WO SENTAKU SHITEKUDA-SAI");
    return;
  }

  const jobNumber = document.getElementById("jobNumber").value.trim();
  if (!jobNumber) {
    showMessage("UKETSUKE-BANGO WO NYURYOKU!");
    return;
  }

  const subject = "受付番号: " + jobNumber + " 現場写真報告分";
  const files = [];

  for (let i = 0; i < selected.length; i++) {
    const photo = selected[i];
    const buffer = await photo.blob.arrayBuffer();
    files.push(new File([buffer], `現場写真_${jobNumber}_${String(i+1).padStart(2,"0")}.jpg`, { type: "image/jpeg" }));
  }

  if (navigator.share && navigator.canShare && navigator.canShare({ files: files })) {
    try {
      await navigator.share({ title: subject, text: subject, files: files });
      showMessage("TRANSMITTING...");
    } catch(e) {}
    return;
  }

  showMessage("SHARE NOT SUPPORTED");
}

let messageTimer = null;
function showMessage(text) {
  const msg = document.getElementById("message");
  msg.textContent = text;
  msg.style.display = "block";
  clearTimeout(messageTimer);
  messageTimer = setTimeout(() => { msg.style.display = "none"; }, 2500);
}
</script>
