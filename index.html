<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1,
               maximum-scale=1,
               user-scalable=no,
               viewport-fit=cover">

<title>現場写真</title>

<style>

/* =========================================================
   基本
========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;

  background: #000;
  color: #fff;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

  overflow: hidden;

  overscroll-behavior: none;
}

body {
  touch-action: manipulation;
}

button,
input {
  font-family: inherit;
}


/* =========================================================
   アプリ
========================================================= */

#app {
  width: 100%;
  height: 100dvh;

  display: flex;
  flex-direction: column;

  background: #000;
}


/* =========================================================
   ヘッダー
========================================================= */

.header {
  height: 58px;

  flex-shrink: 0;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding:
    0 12px;

  background: #181818;

  border-bottom:
    1px solid #333;

  z-index: 20;
}

.title {
  font-size: 19px;
  font-weight: 700;
}

.header-right {
  display: flex;
  gap: 7px;
}

.header-button {
  width: 45px;
  height: 42px;

  border: 0;
  border-radius: 11px;

  background: #333;
  color: #fff;

  font-size: 20px;
}


/* =========================================================
   カメラステージ
========================================================= */

#cameraStage {
  position: relative;

  flex: 1;

  min-height: 0;

  background: #000;

  overflow: hidden;

  touch-action: none;
}


/* カメラ */

#video {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  background: #000;

  pointer-events: none;
}


/* =========================================================
   オーバーレイ
========================================================= */

#overlay {
  position: absolute;

  left: 0;
  top: 0;

  width: 100%;
  height: 100%;

  z-index: 5;

  pointer-events: none;
}


/* =========================================================
   スタンププレビュー
========================================================= */

#stampPreview {

  position: absolute;

  z-index: 8;

  display: none;

  padding:
    6px 10px;

  border:
    2px solid #fff;

  border-radius: 6px;

  background:
    rgba(0,0,0,.65);

  color: #fff;

  font-size: 15px;

  font-weight: 700;

  pointer-events: none;

  white-space: nowrap;
}


/* =========================================================
   矢印
========================================================= */

#arrowPreview {

  position: absolute;

  z-index: 9;

  display: none;

  width: 100px;
  height: 100px;

  transform:
    translate(-50%, -50%);

  pointer-events: none;
}

.arrow-line {

  position: absolute;

  left: 15px;
  bottom: 15px;

  width: 80px;
  height: 6px;

  background: red;

  border-radius: 5px;

  transform:
    rotate(-45deg);

  transform-origin:
    right center;

  box-shadow:
    0 1px 2px rgba(0,0,0,.8);
}

.arrow-head {

  position: absolute;

  right: 5px;
  top: 5px;

  width: 0;
  height: 0;

  border-left:
    18px solid red;

  border-top:
    11px solid transparent;

  border-bottom:
    11px solid transparent;

  transform:
    rotate(-45deg);

  filter:
    drop-shadow(0 1px 1px rgba(0,0,0,.8));
}


/* =========================================================
   カメラ下部
========================================================= */

.cameraControls {

  height: 112px;

  flex-shrink: 0;

  background: #181818;

  position: relative;

  padding-bottom:
    env(safe-area-inset-bottom);

}


/* =========================================================
   撮影ボタン
========================================================= */

#captureButton {

  position: absolute;

  left: 50%;
  top: 9px;

  transform:
    translateX(-50%);

  width: 72px;
  height: 72px;

  border-radius: 50%;

  border:
    5px solid #777;

  background: #fff;

  box-shadow:
    0 0 0 3px #fff;

  z-index: 10;
}

#captureButton:active {
  transform:
    translateX(-50%)
    scale(.91);
}


/* =========================================================
   ツール
========================================================= */

.tools {

  position: absolute;

  left: 8px;
  right: 8px;

  bottom: 8px;

  display: flex;

  justify-content: center;

  gap: 5px;

  z-index: 11;
}

.toolButton {

  height: 43px;

  padding:
    0 13px;

  border: 0;

  border-radius: 11px;

  background:
    rgba(35,35,35,.95);

  color: #fff;

  font-size: 14px;

  white-space: nowrap;
}

.toolButton.active {

  background: #fff;
  color: #111;

  font-weight: 700;
}


/* =========================================================
   メッセージ
========================================================= */

#message {

  position: fixed;

  left: 50%;
  bottom: 130px;

  transform:
    translateX(-50%);

  z-index: 100;

  display: none;

  max-width: 88%;

  padding:
    10px 16px;

  border-radius: 12px;

  background:
    rgba(0,0,0,.88);

  color: #fff;

  font-size: 14px;

  text-align: center;

  box-shadow:
    0 3px 12px rgba(0,0,0,.4);
}


/* =========================================================
   画面
========================================================= */

.fullScreen {

  position: fixed;

  inset: 0;

  z-index: 50;

  display: none;

  flex-direction: column;

  background: #111;
}


/* =========================================================
   共通サブヘッダー
========================================================= */

.subHeader {

  height: 58px;

  flex-shrink: 0;

  display: flex;

  align-items: center;

  justify-content: space-between;

  padding:
    0 12px;

  background: #181818;

  border-bottom:
    1px solid #333;
}

.subTitle {

  font-size: 18px;

  font-weight: 700;
}

.closeButton {

  min-width: 64px;

  height: 42px;

  border: 0;

  border-radius: 10px;

  background: #333;

  color: #fff;

  font-size: 14px;
}


/* =========================================================
   ギャラリー
========================================================= */

#galleryList {

  flex: 1;

  overflow-y: auto;

  padding:
    10px;

  -webkit-overflow-scrolling: touch;
}

.photoItem {

  display: flex;

  align-items: center;

  gap: 9px;

  padding: 8px;

  margin-bottom: 9px;

  background: #222;

  border-radius: 12px;
}

.photoCheck {

  width: 25px;
  height: 25px;

  flex-shrink: 0;
}

.thumbnail {

  width: 90px;
  height: 90px;

  flex-shrink: 0;

  object-fit: cover;

  border-radius: 8px;

  background: #000;
}

.photoInfo {

  flex: 1;

  min-width: 0;
}

.photoLabel {

  font-size: 14px;

  font-weight: 700;
}

.photoTime {

  margin-top: 5px;

  color: #aaa;

  font-size: 12px;
}

.deletePhoto {

  width: 42px;
  height: 42px;

  border: 0;

  border-radius: 9px;

  background: #633;

  color: #fff;

  font-size: 22px;
}


/* =========================================================
   ギャラリー下部
========================================================= */

.galleryBottom {

  flex-shrink: 0;

  padding:
    10px;

  padding-bottom:
    calc(
      10px +
      env(safe-area-inset-bottom)
    );

  background: #181818;

  border-top:
    1px solid #333;
}

#jobNumber {

  width: 100%;

  height: 48px;

  padding:
    0 13px;

  border:
    1px solid #555;

  border-radius: 10px;

  outline: none;

  background: #292929;

  color: #fff;

  font-size: 17px;
}

#jobNumber::placeholder {
  color: #999;
}

.sendButton {

  width: 100%;

  height: 50px;

  margin-top: 8px;

  border: 0;

  border-radius: 11px;

  background: #fff;

  color: #111;

  font-size: 16px;

  font-weight: 700;
}


/* =========================================================
   設定
========================================================= */

.settingsBody {

  flex: 1;

  overflow-y: auto;

  padding: 18px;

  -webkit-overflow-scrolling: touch;
}

.settingSection {

  margin-bottom: 25px;
}

.settingTitle {

  margin-bottom: 10px;

  color: #aaa;

  font-size: 14px;
}

.settingGrid {

  display: grid;

  grid-template-columns:
    1fr 1fr;

  gap: 9px;
}

.settingButton {

  min-height: 52px;

  border: 0;

  border-radius: 11px;

  background: #292929;

  color: #fff;

  font-size: 15px;
}

.settingButton.selected {

  background: #fff;

  color: #111;

  font-weight: 700;
}

.helpText {

  color: #aaa;

  line-height: 1.7;

  font-size: 14px;
}


/* =========================================================
   カメラエラー
========================================================= */

#cameraError {

  position: absolute;

  inset: 0;

  z-index: 30;

  display: none;

  align-items: center;

  justify-content: center;

  padding: 30px;

  background: #000;

  text-align: center;
}

.errorButton {

  margin-top: 15px;

  padding:
    12px 20px;

  border: 0;

  border-radius: 10px;

  background: #fff;

  color: #111;

  font-size: 16px;
}


/* =========================================================
   写真なし
========================================================= */

.emptyGallery {

  padding-top: 70px;

  text-align: center;

  color: #777;

  line-height: 1.8;
}

</style>

</head>


<body>

<div id="app">

  <!-- =====================================================
       ヘッダー
  ====================================================== -->

  <header class="header">

    <div class="title">
      現場写真
    </div>

    <div class="header-right">

      <button
        class="header-button"
        id="galleryButton">
        📷
      </button>

      <button
        class="header-button"
        id="settingsButton">
        ⚙️
      </button>

    </div>

  </header>


  <!-- =====================================================
       カメラ
  ====================================================== -->

  <main id="cameraStage">

    <video
      id="video"
      autoplay
      playsinline
      muted>
    </video>


    <!-- 矢印などの表示 -->
    <canvas id="overlay"></canvas>


    <!-- スタンプ -->
    <div id="stampPreview"></div>


    <!-- 矢印プレビュー -->
    <div id="arrowPreview">

      <div class="arrow-line"></div>

      <div class="arrow-head"></div>

    </div>


    <!-- カメラエラー -->
    <div id="cameraError">

      <div>

        <h2>
          カメラを起動できません
        </h2>

        <p id="cameraErrorText">
          カメラへのアクセスを確認してください。
        </p>

        <button
          class="errorButton"
          id="retryButton">
          再試行
        </button>

      </div>

    </div>

  </main>


  <!-- =====================================================
       カメラコントロール
  ====================================================== -->

  <section class="cameraControls">

    <button
      id="captureButton"
      aria-label="撮影">
    </button>


    <div class="tools">

      <button
        class="toolButton"
        data-stamp="作業前">
        作業前
      </button>

      <button
        class="toolButton"
        data-stamp="作業中">
        作業中
      </button>

      <button
        class="toolButton"
        data-stamp="作業後">
        作業後
      </button>

      <button
        class="toolButton"
        id="arrowButton">
        ➜ 矢印
      </button>

    </div>

  </section>

</div>


<!-- =======================================================
     ギャラリー
======================================================== -->

<section
  id="gallery"
  class="fullScreen">

  <header class="subHeader">

    <div class="subTitle">
      撮影済み写真
    </div>

    <button
      class="closeButton"
      id="closeGallery">
      閉じる
    </button>

  </header>


  <div id="galleryList"></div>


  <div class="galleryBottom">

    <input
      id="jobNumber"
      type="text"
      placeholder="受付番号"
      autocomplete="off">

    <button
      class="sendButton"
      id="sendButton">
      ☑ 選択した写真をメール送信
    </button>

  </div>

</section>


<!-- =======================================================
     設定
======================================================== -->

<section
  id="settings"
  class="fullScreen">

  <header class="subHeader">

    <div class="subTitle">
      設定
    </div>

    <button
      class="closeButton"
      id="closeSettings">
      閉じる
    </button>

  </header>


  <div class="settingsBody">


    <!-- スタンプ位置 -->

    <div class="settingSection">

      <div class="settingTitle">
        作業状態スタンプの位置
      </div>

      <div class="settingGrid">

        <button
          class="settingButton"
          data-position="top-left">
          左上
        </button>

        <button
          class="settingButton"
          data-position="top-right">
          右上
        </button>

        <button
          class="settingButton"
          data-position="bottom-left">
          左下
        </button>

        <button
          class="settingButton"
          data-position="bottom-right">
          右下
        </button>

      </div>

    </div>


    <!-- 矢印サイズ -->

    <div class="settingSection">

      <div class="settingTitle">
        矢印の大きさ
      </div>

      <div class="settingGrid">

        <button
          class="settingButton"
          data-arrow-size="0.7">
          小
        </button>

        <button
          class="settingButton"
          data-arrow-size="1">
          標準
        </button>

        <button
          class="settingButton"
          data-arrow-size="1.4">
          大
        </button>

        <button
          class="settingButton"
          data-arrow-size="1.8">
          特大
        </button>

      </div>

    </div>


    <div class="settingSection">

      <div class="settingTitle">
        使い方
      </div>

      <div class="helpText">

        <p>
          <strong>① 作業状態</strong><br>
          「作業前」「作業中」「作業後」のいずれかを選択します。
        </p>

        <p>
          <strong>② 矢印</strong><br>
          「➜ 矢印」を選択すると、カメラ画面に矢印が表示されます。
          指でドラッグして故障箇所へ移動できます。
        </p>

        <p>
          <strong>③ 撮影</strong><br>
          シャッターボタンを押すと、選択したスタンプと矢印が写真に焼き込まれます。
        </p>

        <p>
          <strong>④ 写真一覧</strong><br>
          右上の📷から撮影済み写真を確認できます。
        </p>

      </div>

    </div>

  </div>

</section>


<!-- =======================================================
     メッセージ
======================================================== -->

<div id="message"></div>


<script>

/* =========================================================
   状態
========================================================= */

let video =
  document.getElementById("video");

let cameraStage =
  document.getElementById("cameraStage");

let captureButton =
  document.getElementById("captureButton");

let overlay =
  document.getElementById("overlay");

let stampPreview =
  document.getElementById("stampPreview");

let arrowPreview =
  document.getElementById("arrowPreview");

let currentStamp =
  null;

let stampPosition =
  localStorage.getItem("stampPosition")
  || "top-right";

let arrowSize =
  Number(
    localStorage.getItem("arrowSize")
    || "1"
  );

let arrowPoint =
  null;

let draggingArrow =
  false;

let photos = [];

let stream =
  null;


/* =========================================================
   初期化
========================================================= */

window.addEventListener(
  "load",
  async function() {

    updateSettingsUI();

    updateStampPreview();

    setupEvents();

    await startCamera();

  }
);


/* =========================================================
   イベント設定
========================================================= */

function setupEvents() {


  /* -----------------------------------
     スタンプ
  ----------------------------------- */

  document
    .querySelectorAll("[data-stamp]")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            selectStamp(
              this.dataset.stamp
            );

          }
        );

      }
    );


  /* -----------------------------------
     矢印
  ----------------------------------- */

  document
    .getElementById("arrowButton")
    .addEventListener(
      "click",
      selectArrow
    );


  /* -----------------------------------
     撮影
  ----------------------------------- */

  captureButton.addEventListener(
    "click",
    capturePhoto
  );


  /* -----------------------------------
     ギャラリー
  ----------------------------------- */

  document
    .getElementById("galleryButton")
    .addEventListener(
      "click",
      openGallery
    );

  document
    .getElementById("closeGallery")
    .addEventListener(
      "click",
      closeGallery
    );


  /* -----------------------------------
     設定
  ----------------------------------- */

  document
    .getElementById("settingsButton")
    .addEventListener(
      "click",
      openSettings
    );

  document
    .getElementById("closeSettings")
    .addEventListener(
      "click",
      closeSettings
    );


  /* -----------------------------------
     設定：スタンプ位置
  ----------------------------------- */

  document
    .querySelectorAll("[data-position]")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            setStampPosition(
              this.dataset.position
            );

          }
        );

      }
    );


  /* -----------------------------------
     設定：矢印サイズ
  ----------------------------------- */

  document
    .querySelectorAll("[data-arrow-size]")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          function() {

            setArrowSize(
              Number(
                this.dataset.arrowSize
              )
            );

          }
        );

      }
    );


  /* -----------------------------------
     矢印ドラッグ
  ----------------------------------- */

  cameraStage.addEventListener(
    "pointerdown",
    arrowPointerDown
  );

  cameraStage.addEventListener(
    "pointermove",
    arrowPointerMove
  );

  cameraStage.addEventListener(
    "pointerup",
    arrowPointerUp
  );

  cameraStage.addEventListener(
    "pointercancel",
    arrowPointerUp
  );


  /* -----------------------------------
     再試行
  ----------------------------------- */

  document
    .getElementById("retryButton")
    .addEventListener(
      "click",
      startCamera
    );


  /* -----------------------------------
     メール
  ----------------------------------- */

  document
    .getElementById("sendButton")
    .addEventListener(
      "click",
      sendSelectedPhotos
    );

}


/* =========================================================
   カメラ
========================================================= */

async function startCamera() {

  const error =
    document.getElementById(
      "cameraError"
    );

  error.style.display =
    "none";

  try {

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "このブラウザではカメラを利用できません。"
      );

    }


    if (stream) {

      stream
        .getTracks()
        .forEach(
          track =>
            track.stop()
        );

    }


    stream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: {
            ideal: "environment"
          },

          width: {
            ideal: 1920
          },

          height: {
            ideal: 1080
          }

        },

        audio: false

      });


    video.srcObject =
      stream;

    await video.play();


    showMessage(
      "カメラ起動完了"
    );


  } catch (e) {

    console.error(e);

    error.style.display =
      "flex";

    document
      .getElementById(
        "cameraErrorText"
      )
      .textContent =
      e.name +
      " : " +
      e.message;

  }

}


/* =========================================================
   スタンプ選択
========================================================= */

function selectStamp(label) {

  currentStamp =
    label;

  /* 矢印モード解除 */

  arrowPoint =
    null;

  arrowPreview.style.display =
    "none";


  /* ボタン状態 */

  document
    .querySelectorAll(".toolButton")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  const target =
    document.querySelector(
      `[data-stamp="${label}"]`
    );

  if (target) {

    target.classList.add(
      "active"
    );

  }


  stampPreview.textContent =
    label;

  stampPreview.style.display =
    "block";

  updateStampPreview();

}


/* =========================================================
   矢印モード
========================================================= */

function selectArrow() {

  currentStamp =
    null;

  stampPreview.style.display =
    "none";


  document
    .querySelectorAll(".toolButton")
    .forEach(
      button =>
        button.classList.remove(
          "active"
        )
    );


  document
    .getElementById("arrowButton")
    .classList.add(
      "active"
    );


  showMessage(
    "画面をタップして矢印を配置"
  );

}


/* =========================================================
   スタンププレビュー
========================================================= */

function updateStampPreview() {

  if (!currentStamp) {

    stampPreview.style.display =
      "none";

    return;

  }


  const margin =
    15;


  stampPreview.style.left =
    "";

  stampPreview.style.right =
    "";

  stampPreview.style.top =
    "";

  stampPreview.style.bottom =
    "";


  if (
    stampPosition ===
    "top-left"
  ) {

    stampPreview.style.left =
      margin + "px";

    stampPreview.style.top =
      margin + "px";

  }


  if (
    stampPosition ===
    "top-right"
  ) {

    stampPreview.style.right =
      margin + "px";

    stampPreview.style.top =
      margin + "px";

  }


  if (
    stampPosition ===
    "bottom-left"
  ) {

    stampPreview.style.left =
      margin + "px";

    stampPreview.style.bottom =
      margin + "px";

  }


  if (
    stampPosition ===
    "bottom-right"
  ) {

    stampPreview.style.right =
      margin + "px";

    stampPreview.style.bottom =
      margin + "px";

  }

}


/* =========================================================
   矢印 PointerDown
========================================================= */

function arrowPointerDown(e) {

  /*
    矢印モードかどうか
  */

  const arrowButton =
    document.getElementById(
      "arrowButton"
    );

  if (
    !arrowButton.classList.contains(
      "active"
    )
  ) {

    return;

  }


  e.preventDefault();


  const p =
    getStagePoint(e);


  /*
    既に矢印がある場合、
    その近くを触ったらドラッグ
  */

  if (arrowPoint) {

    const dx =
      p.x -
      arrowPoint.x;

    const dy =
      p.y -
      arrowPoint.y;

    const distance =
      Math.sqrt(
        dx * dx +
        dy * dy
      );

    if (distance < 80) {

      draggingArrow =
        true;

      cameraStage.setPointerCapture(
        e.pointerId
      );

      return;

    }

  }


  /*
    新しい矢印
  */

  arrowPoint = {

    x: p.x,
    y: p.y

  };

  draggingArrow =
    true;

  cameraStage.setPointerCapture(
    e.pointerId
  );

  updateArrowPreview();


  showMessage(
    "指でドラッグして位置を調整できます"
  );

}


/* =========================================================
   矢印 PointerMove
========================================================= */

function arrowPointerMove(e) {

  if (!draggingArrow) {

    return;

  }

  e.preventDefault();


  const p =
    getStagePoint(e);


  arrowPoint = {

    x: p.x,
    y: p.y

  };


  updateArrowPreview();

}


/* =========================================================
   矢印 PointerUp
========================================================= */

function arrowPointerUp(e) {

  if (!draggingArrow) {

    return;

  }

  draggingArrow =
    false;

}


/* =========================================================
   ステージ座標
========================================================= */

function getStagePoint(e) {

  const rect =
    cameraStage.getBoundingClientRect();


  let x =
    e.clientX -
    rect.left;

  let y =
    e.clientY -
    rect.top;


  x =
    Math.max(
      0,
      Math.min(
        rect.width,
        x
      )
    );


  y =
    Math.max(
      0,
      Math.min(
        rect.height,
        y
      )
    );


  return {
    x: x,
    y: y
  };

}


/* =========================================================
   矢印プレビュー
========================================================= */

function updateArrowPreview() {

  if (!arrowPoint) {

    arrowPreview.style.display =
      "none";

    return;

  }


  arrowPreview.style.display =
    "block";


  arrowPreview.style.left =
    arrowPoint.x + "px";

  arrowPreview.style.top =
    arrowPoint.y + "px";


  const size =
    100 *
    arrowSize;


  arrowPreview.style.width =
    size + "px";

  arrowPreview.style.height =
    size + "px";

}


/* =========================================================
   撮影
========================================================= */

function capturePhoto() {

  if (
    !video.videoWidth ||
    !video.videoHeight
  ) {

    showMessage(
      "カメラの準備中です"
    );

    return;

  }


  /*
    実際のカメラ画像サイズ
  */

  const width =
    video.videoWidth;

  const height =
    video.videoHeight;


  const canvas =
    document.createElement(
      "canvas"
    );

  canvas.width =
    width;

  canvas.height =
    height;


  const ctx =
    canvas.getContext(
      "2d"
    );


  /*
    カメラ映像
  */

  ctx.drawImage(
    video,
    0,
    0,
    width,
    height
  );


  /*
    スタンプ
  */

  if (currentStamp) {

    drawStamp(
      ctx,
      currentStamp,
      width,
      height
    );

  }


  /*
    矢印
  */

  if (arrowPoint) {

    const sourcePoint =
      stageToSource(
        arrowPoint.x,
        arrowPoint.y
      );


    drawArrowOnPhoto(
      ctx,
      sourcePoint.x,
      sourcePoint.y,
      width,
      height
    );

  }


  /*
    JPEG
  */

  canvas.toBlob(

    function(blob) {

      if (!blob) {

        showMessage(
          "写真の作成に失敗しました"
        );

        return;

      }


      const photo = {

        id:
          Date.now(),

        blob:
          blob,

        stamp:
          currentStamp,

        created:
          new Date(),

        selected:
          false

      };


      photos.push(
        photo
      );


      /*
        撮影後も矢印は残す
      */

      renderGallery();


      showMessage(
        "写真を保存しました"
      );

    },

    "image/jpeg",

    0.92

  );

}


/* =========================================================
   表示座標 → 実画像座標
   object-fit: cover 対応
========================================================= */

function stageToSource(
  stageX,
  stageY
) {

  const stageWidth =
    cameraStage.clientWidth;

  const stageHeight =
    cameraStage.clientHeight;


  const sourceWidth =
    video.videoWidth;

  const sourceHeight =
    video.videoHeight;


  /*
    object-fit: cover の倍率
  */

  const scale =
    Math.max(
      stageWidth / sourceWidth,
      stageHeight / sourceHeight
    );


  const renderedWidth =
    sourceWidth *
    scale;

  const renderedHeight =
    sourceHeight *
    scale;


  /*
    中央配置による切り取り
  */

  const offsetX =
    (stageWidth -
     renderedWidth) / 2;

  const offsetY =
    (stageHeight -
     renderedHeight) / 2;


  /*
    実画像座標
  */

  let x =
    (stageX -
     offsetX) /
    scale;

  let y =
    (stageY -
     offsetY) /
    scale;


  x =
    Math.max(
      0,
      Math.min(
        sourceWidth,
        x
      )
    );


  y =
    Math.max(
      0,
      Math.min(
        sourceHeight,
        y
      )
    );


  return {
    x: x,
    y: y
  };

}


/* =========================================================
   スタンプ描画
========================================================= */

function drawStamp(
  ctx,
  label,
  width,
  height
) {

  const fontSize =
    Math.max(
      40,
      Math.round(
        width *
        0.035
      )
    );


  ctx.font =
    "bold " +
    fontSize +
    "px sans-serif";


  const padding =
    fontSize *
    0.35;


  const textWidth =
    ctx.measureText(
      label
    ).width;


  const boxWidth =
    textWidth +
    padding * 2;


  const boxHeight =
    fontSize +
    padding * 2;


  const margin =
    Math.round(
      width *
      0.025
    );


  let x = 0;
  let y = 0;


  if (
    stampPosition ===
    "top-left"
  ) {

    x =
      margin;

    y =
      margin;

  }


  if (
    stampPosition ===
    "top-right"
  ) {

    x =
      width -
      boxWidth -
      margin;

    y =
      margin;

  }


  if (
    stampPosition ===
    "bottom-left"
  ) {

    x =
      margin;

    y =
      height -
      boxHeight -
      margin;

  }


  if (
    stampPosition ===
    "bottom-right"
  ) {

    x =
      width -
      boxWidth -
      margin;

    y =
      height -
      boxHeight -
      margin;

  }


  /*
    背景
  */

  ctx.fillStyle =
    "rgba(0,0,0,.65)";


  ctx.fillRect(
    x,
    y,
    boxWidth,
    boxHeight
  );


  /*
    枠
  */

  ctx.strokeStyle =
    "#fff";

  ctx.lineWidth =
    Math.max(
      3,
      width *
      0.003
    );


  ctx.strokeRect(
    x,
    y,
    boxWidth,
    boxHeight
  );


  /*
    文字
  */

  ctx.fillStyle =
    "#fff";

  ctx.textBaseline =
    "middle";


  ctx.fillText(
    label,
    x + padding,
    y +
    boxHeight / 2
  );

}


/* =========================================================
   矢印描画
========================================================= */

function drawArrowOnPhoto(
  ctx,
  x,
  y,
  width,
  height
) {

  const length =
    Math.min(
      width,
      height
    ) *
    0.18 *
    arrowSize;


  const lineWidth =
    Math.max(
      6,
      width *
      0.006
    ) *
    arrowSize;


  /*
    左下 → 指定ポイント
  */

  const startX =
    x -
    length;

  const startY =
    y +
    length;


  const angle =
    Math.atan2(
      y - startY,
      x - startX
    );


  ctx.save();


  ctx.strokeStyle =
    "red";

  ctx.fillStyle =
    "red";

  ctx.lineWidth =
    lineWidth;

  ctx.lineCap =
    "round";

  ctx.lineJoin =
    "round";


  /*
    線
  */

  ctx.beginPath();

  ctx.moveTo(
    startX,
    startY
  );

  ctx.lineTo(
    x,
    y
  );

  ctx.stroke();


  /*
    矢印の頭
  */

  const head =
    length *
    0.30;


  ctx.beginPath();

  ctx.moveTo(
    x,
    y
  );


  ctx.lineTo(

    x -
    head *
    Math.cos(
      angle -
      Math.PI / 6
    ),

    y -
    head *
    Math.sin(
      angle -
      Math.PI / 6
    )

  );


  ctx.lineTo(

    x -
    head *
    Math.cos(
      angle +
      Math.PI / 6
    ),

    y -
    head *
    Math.sin(
      angle +
      Math.PI / 6
    )

  );


  ctx.closePath();

  ctx.fill();


  ctx.restore();

}


/* =========================================================
   ギャラリー
========================================================= */

function openGallery() {

  document
    .getElementById("gallery")
    .style.display =
    "flex";


  renderGallery();

}


function closeGallery() {

  document
    .getElementById("gallery")
    .style.display =
    "none";

}


/* =========================================================
   ギャラリー描画
========================================================= */

function renderGallery() {

  const list =
    document.getElementById(
      "galleryList"
    );


  list.innerHTML =
    "";


  if (
    photos.length === 0
  ) {

    list.innerHTML = `

      <div class="emptyGallery">

        まだ写真がありません。<br>
        カメラ画面から撮影してください。

      </div>

    `;

    return;

  }


  photos.forEach(
    function(photo) {

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "photoItem";


      /*
        サムネイル
      */

      const img =
        document.createElement(
          "img"
        );


      img.className =
        "thumbnail";


      img.src =
        URL.createObjectURL(
          photo.blob
        );


      /*
        チェック
      */

      const check =
        document.createElement(
          "input"
        );


      check.type =
        "checkbox";

      check.className =
        "photoCheck";

      check.checked =
        photo.selected;


      check.addEventListener(
        "change",
        function() {

          photo.selected =
            this.checked;

        }
      );


      /*
        情報
      */

      const info =
        document.createElement(
          "div"
        );


      info.className =
        "photoInfo";


      const label =
        document.createElement(
          "div"
        );


      label.className =
        "photoLabel";


      label.textContent =
        photo.stamp ||
        "写真";


      const time =
        document.createElement(
          "div"
        );


      time.className =
        "photoTime";


      time.textContent =
        formatTime(
          photo.created
        );


      info.appendChild(
        label
      );

      info.appendChild(
        time
      );


      /*
        削除
      */

      const del =
        document.createElement(
          "button"
        );


      del.className =
        "deletePhoto";

      del.textContent =
        "×";


      del.addEventListener(
        "click",
        function() {

          deletePhoto(
            photo.id
          );

        }
      );


      item.appendChild(
        check
      );

      item.appendChild(
        img
      );

      item.appendChild(
        info
      );

      item.appendChild(
        del
      );


      list.appendChild(
        item
      );

    }
  );

}


/* =========================================================
   写真削除
========================================================= */

function deletePhoto(id) {

  const target =
    photos.find(
      p =>
        p.id === id
    );


  if (!target) {

    return;

  }


  const ok =
    confirm(
      "この写真を削除しますか？"
    );


  if (!ok) {

    return;

  }


  photos =
    photos.filter(
      p =>
        p.id !== id
    );


  renderGallery();

}


/* =========================================================
   時刻
========================================================= */

function formatTime(date) {

  const d =
    new Date(date);


  return (

    d.getHours()
      .toString()
      .padStart(2,"0")

    + ":" +

    d.getMinutes()
      .toString()
      .padStart(2,"0")

    + ":" +

    d.getSeconds()
      .toString()
      .padStart(2,"0")

  );

}


/* =========================================================
   設定
========================================================= */

function openSettings() {

  document
    .getElementById("settings")
    .style.display =
    "flex";


  updateSettingsUI();

}


function closeSettings() {

  document
    .getElementById("settings")
    .style.display =
    "none";

}


/* =========================================================
   スタンプ位置
========================================================= */

function setStampPosition(
  position
) {

  stampPosition =
    position;


  localStorage.setItem(
    "stampPosition",
    position
  );


  updateSettingsUI();

  updateStampPreview();


  showMessage(
    "スタンプ位置を変更しました"
  );

}


/* =========================================================
   矢印サイズ
========================================================= */

function setArrowSize(
  size
) {

  arrowSize =
    size;


  localStorage.setItem(
    "arrowSize",
    String(size)
  );


  updateSettingsUI();

  updateArrowPreview();


  showMessage(
    "矢印サイズを変更しました"
  );

}


/* =========================================================
   設定UI
========================================================= */

function updateSettingsUI() {


  document
    .querySelectorAll(
      "[data-position]"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "selected",

          button.dataset.position ===
          stampPosition

        );

      }
    );


  document
    .querySelectorAll(
      "[data-arrow-size]"
    )
    .forEach(
      button => {

        button.classList.toggle(

          "selected",

          Number(
            button.dataset.arrowSize
          ) === arrowSize

        );

      }
    );

}


/* =========================================================
   選択写真
========================================================= */

function getSelectedPhotos() {

  return photos.filter(
    photo =>
      photo.selected
  );

}


/* =========================================================
   メール共有
========================================================= */

async function sendSelectedPhotos() {

  const selected =
    getSelectedPhotos();


  if (
    selected.length === 0
  ) {

    showMessage(
      "送信する写真を選択してください"
    );

    return;

  }


  const jobNumber =
    document
      .getElementById(
        "jobNumber"
      )
      .value
      .trim();


  if (!jobNumber) {

    showMessage(
      "受付番号を入力してください"
    );

    return;

  }


  /*
    件名
  */

  const subject =
    jobNumber +
    " 現場写真報告分";


  /*
    Fileを作る
  */

  const files = [];


  for (
    let i = 0;
    i < selected.length;
    i++
  ) {

    const photo =
      selected[i];


    const buffer =
      await photo.blob
        .arrayBuffer();


    const file =
      new File(

        [buffer],

        "現場写真_" +
        jobNumber +
        "_" +
        String(i + 1)
          .padStart(2,"0") +
        ".jpg",

        {
          type:
            "image/jpeg"
        }

      );


    files.push(
      file
    );

  }


  /*
    iPhone共有
  */

  if (
    navigator.share &&
    navigator.canShare &&
    navigator.canShare({
      files: files
    })
  {

    try {

      await navigator.share({

        title:
          subject,

        text:
          subject,

        files:
          files

      });


      showMessage(
        "共有シートを開きました"
      );


    } catch(e) {

      /*
        ユーザーが共有シートを閉じた場合など
      */

      console.log(e);

    }


    return;

  }


  /*
    Web Share非対応
  */

  showMessage(
    "このSafariでは写真共有機能を利用できません"
  );

}


/* =========================================================
   メッセージ
========================================================= */

let messageTimer =
  null;


function showMessage(text) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.style.display =
    "block";


  clearTimeout(
    messageTimer
  );


  messageTimer =
    setTimeout(
      function() {

        message.style.display =
          "none";

      },
      2500
    );

}


/* =========================================================
   画面サイズ変更
========================================================= */

window.addEventListener(
  "resize",
  function() {

    updateStampPreview();

    updateArrowPreview();

  }
);

</script>
