<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width,
                 initial-scale=1,
                 maximum-scale=1,
                 user-scalable=no">

  <title>現場写真</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    h1 {
      font-size: 20px;
      margin: 0;
      padding: 18px;
      background: #181818;
    }

    #camera {
      flex: 1;
      width: 100%;
      object-fit: cover;
      background: #000;
    }

    #status {
      padding: 15px;
      text-align: center;
      background: #181818;
      font-size: 16px;
    }

    button {
      margin: 12px;
      padding: 14px 20px;
      border: 0;
      border-radius: 10px;
      font-size: 17px;
    }
  </style>
</head>

<body>

  <h1>現場写真</h1>

  <video
    id="camera"
    autoplay
    playsinline
    muted>
  </video>

  <div id="status">
    カメラを起動しています…
  </div>

  <script>

    async function startCamera() {

      const video =
        document.getElementById("camera");

      const status =
        document.getElementById("status");

      try {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            "このブラウザではカメラ機能を利用できません。"
          );

        }

        const stream =
          await navigator.mediaDevices.getUserMedia({

            video: {
              facingMode: {
                ideal: "environment"
              }
            },

            audio: false

          });

        video.srcObject = stream;

        status.textContent =
          "カメラ起動成功";

      } catch (error) {

        console.error(error);

        status.innerHTML =
          "カメラを起動できませんでした<br><br>" +
          error.name +
          "<br>" +
          error.message;

      }

    }

    startCamera();

  </script>

</body>
</html>
